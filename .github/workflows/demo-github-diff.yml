name: Demo — GitHub diff issues

# Diff-driven issues vs last green scan: open for new findings, close when fixed.
# Uses a local mock GitHub API (FOXHOLE_GITHUB_API) — no real issues created.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/notify/**"
      - "internal/diff/**"
      - "internal/db/**"
      - "internal/triage/**"
      - "internal/cli/**"
      - "examples/**"
      - ".github/workflows/demo-github-diff.yml"
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/notify/**"
      - "internal/diff/**"
      - "internal/db/**"
      - "internal/triage/**"
      - "internal/cli/**"
      - "examples/**"
      - ".github/workflows/demo-github-diff.yml"

permissions:
  contents: read

jobs:
  github-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOXHOLE_DB_PATH: ${{ github.workspace }}/.foxhole/foxhole.db
      FOXHOLE_GITHUB_TOKEN: demo-token
      FOXHOLE_GITHUB_REPO: demo/foxhole
      FOXHOLE_GITHUB_API: http://127.0.0.1:9876
      DEMO: examples/phase2-findings

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.12"
          cache: true

      - name: Build
        run: go build -o bin/foxhole ./cmd/foxhole

      - name: Seed DB (offline)
        run: |
          mkdir -p "$(dirname "$FOXHOLE_DB_PATH")"
          ./bin/foxhole db update "$DEMO" --db-path "$FOXHOLE_DB_PATH" --offline

      - name: Start mock GitHub API
        run: |
          python3 - <<'PY' &
          import json, re, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          state = {"next": 100, "created": [], "closed": [], "comments": []}
          lock = threading.Lock()

          class H(BaseHTTPRequestHandler):
              def _json(self, code, obj):
                  body = json.dumps(obj).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  raw = self.rfile.read(length)
                  path = self.path
                  with lock:
                      if path.endswith("/issues") and "/comments" not in path:
                          n = state["next"]
                          state["next"] += 1
                          state["created"].append({"number": n, "body": raw.decode()})
                          open("mock-github-created.json", "w").write(json.dumps(state["created"], indent=2))
                          self._json(201, {"number": n})
                          return
                      if "/comments" in path:
                          state["comments"].append(raw.decode())
                          open("mock-github-comments.json", "w").write(json.dumps(state["comments"], indent=2))
                          self._json(201, {"id": 1})
                          return
                  self._json(404, {"error": path})

              def do_PATCH(self):
                  length = int(self.headers.get("Content-Length", 0))
                  raw = self.rfile.read(length)
                  m = re.search(r"/issues/(\d+)$", self.path)
                  with lock:
                      if m:
                          state["closed"].append({"number": int(m.group(1)), "body": raw.decode()})
                          open("mock-github-closed.json", "w").write(json.dumps(state["closed"], indent=2))
                          self._json(200, {"state": "closed"})
                          return
                  self._json(404, {"error": self.path})

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 9876), H).serve_forever()
          PY
          echo $! > mock-github.pid
          sleep 1

      - name: Last-green baseline (scanners off → clean)
        run: |
          ABS="$(cd "$DEMO" && pwd)"
          ./bin/foxhole "$ABS" \
            --db-path "$FOXHOLE_DB_PATH" \
            --offline \
            --secrets=false --eol=false --misconfig=false --licenses=false \
            --report console \
            | tee green-scan.txt
          ./bin/foxhole history "$ABS" --db-path "$FOXHOLE_DB_PATH" --limit 5 | tee history.txt
          grep -q ok history.txt

      - name: New findings → open issues (--github-diff + --triage)
        run: |
          ABS="$(cd "$DEMO" && pwd)"
          ./bin/foxhole "$ABS" \
            --db-path "$FOXHOLE_DB_PATH" \
            --offline \
            --triage \
            --github-diff \
            --report console \
            | tee open-scan.txt
          grep -q "Notified github-diff" open-scan.txt
          test -f foxhole-triage.md
          test -s mock-github-created.json
          python3 - <<'PY'
          import json
          created = json.load(open("mock-github-created.json"))
          assert len(created) >= 1, created
          body = created[0]["body"]
          assert "title" in body and "body" in body
          payload = json.loads(body)
          assert payload["title"]
          assert "suppressions" in payload["body"] or "Foxhole" in payload["body"]
          print(f"opened {len(created)} issue(s)")
          open("opened-count.txt", "w").write(str(len(created)))
          PY

      - name: Same findings again → no duplicate issues
        run: |
          ABS="$(cd "$DEMO" && pwd)"
          before=$(cat opened-count.txt)
          ./bin/foxhole "$ABS" \
            --db-path "$FOXHOLE_DB_PATH" \
            --offline \
            --github-diff \
            --report console \
            | tee reopen-scan.txt
          grep -q "Notified github-diff" reopen-scan.txt
          after=$(python3 -c 'import json; print(len(json.load(open("mock-github-created.json"))))')
          test "$before" -eq "$after"

      - name: Findings cleared → close mapped issues
        run: |
          ABS="$(cd "$DEMO" && pwd)"
          # New green baseline is not required; diff is vs last green (clean).
          # Current scan with scanners off removes findings → close.
          ./bin/foxhole "$ABS" \
            --db-path "$FOXHOLE_DB_PATH" \
            --offline \
            --secrets=false --eol=false --misconfig=false --licenses=false \
            --github-diff \
            --report console \
            | tee close-scan.txt
          grep -q "Notified github-diff" close-scan.txt
          test -f mock-github-closed.json
          python3 - <<'PY'
          import json
          closed = json.load(open("mock-github-closed.json"))
          assert len(closed) >= 1, closed
          print(f"closed {len(closed)} issue(s)")
          PY
          # History should show policy_passed / ok and policy_failed statuses over time
          ./bin/foxhole history "$ABS" --db-path "$FOXHOLE_DB_PATH" --limit 10 | tee history-final.txt

      - name: Stop mock
        if: always()
        run: kill "$(cat mock-github.pid)" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: foxhole-demo-github-diff
          path: |
            green-scan.txt
            history.txt
            history-final.txt
            open-scan.txt
            reopen-scan.txt
            close-scan.txt
            opened-count.txt
            mock-github-*.json
            foxhole-triage.*
          if-no-files-found: ignore
