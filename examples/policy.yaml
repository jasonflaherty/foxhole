# Example CI policy for Foxhole.
#
#   foxhole policy validate examples/policy.yaml
#   foxhole . --policy examples/policy.yaml
#
# Exit code 2 when findings meet fail_on (after suppressions).

id: example-ci
version: "1.0"

fail_on: high
kinds:
  - vuln
  - secret
  - eol

# Permanent skips (prefer suppressions with ticket + until for audit):
# ignore:
#   - CVE-2020-0000

# Time-bounded accepted risk (expired entries no longer skip):
suppressions:
  # - id: CVE-2024-0001
  #   until: "2026-12-01"
  #   ticket: "SEC-1234"
  #   reason: "Accepted risk pending vendor patch"
