# Foxhole configuration example
# Precedence: CLI flags > environment variables > this file

db_path: ~/.foxhole/foxhole.db
offline: false
log_level: info
archive_dir: archive
report: console
secrets: true
eol: true
# fail_on: high              # CI gate: critical|high|medium|low|info|any
# policy: examples/policy.yaml
# policy_dir: examples/policy-pack
# split_reports: true
# max_db_age: 720h           # exit 1 if DB older than duration
# api_token: ""              # FOXHOLE_API_TOKEN for foxhole serve
# nvd_api_key: ""  # optional; improves NVD rate limits
