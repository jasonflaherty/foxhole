name: Publish container image

# Build and push ghcr.io/<owner>/<repo> from main (latest) and version tags / releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name (lowercase for GHCR)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            SHORT="$(git rev-parse --short HEAD)"
            VERSION="0.3.0-dev.${SHORT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref_type != 'tag' && github.event_name != 'release' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Sign by digest for each published tag that resolves to this digest.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        run: |
          {
            echo "## Published Foxhole image"
            echo ""
            echo "- Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- Version build-arg: \`${{ steps.ver.outputs.version }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Cosign: keyless sign applied to image digest"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp='https://github.com/jasonflaherty/foxhole/\\.github/workflows/publish-image\\.yml@.*' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\"
            echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
            echo "docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest version"
            echo '```'
            echo ""
            echo "If pulls fail with 403, set the GHCR package visibility to **Public** (Packages → foxhole → Package settings)."
          } >> "$GITHUB_STEP_SUMMARY"
