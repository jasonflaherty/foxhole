# Example CI policy for Foxhole.
# Use: foxhole . --policy examples/policy.yaml
# Or:  foxhole policy validate examples/policy.yaml

id: example-ci
version: "1.0"

fail_on: high
kinds:
  - vuln
  - secret
  - eol

# Permanent skips (legacy). Prefer suppressions with ticket + until for audit.
# ignore:
#   - CVE-2020-0000
#   - aws-access-key-id

# Time-bounded accepted risk (expired entries no longer skip).
suppressions:
  # - id: CVE-2024-0001
  #   until: "2026-12-01"
  #   ticket: "SEC-1234"
  #   reason: "Accepted risk pending vendor patch"
