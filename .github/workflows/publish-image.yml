name: Publish container image

# Build, Trivy-scan (CRITICAL/HIGH), push to GHCR and (when secrets are set) Docker Hub.
# Triggers: main, v* tags, releases, workflow_dispatch.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing
  security-events: write # Trivy SARIF → Code Scanning

env:
  GHCR_REGISTRY: ghcr.io
  SCAN_IMAGE: foxhole:scan

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR="${GITHUB_REPOSITORY,,}"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"

          # Flags must be written outside the images heredoc — otherwise they
          # land inside the multiline value and break docker/metadata-action.
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "push_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub=${DOCKERHUB_USERNAME}/foxhole" >> "$GITHUB_OUTPUT"
            {
              echo "images<<EOF"
              echo "ghcr.io/${GHCR}"
              echo "docker.io/${DOCKERHUB_USERNAME}/foxhole"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "push_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "dockerhub=" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME not set — publishing to GHCR only"
            {
              echo "images<<EOF"
              echo "ghcr.io/${GHCR}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            SHORT="$(git rev-parse --short HEAD)"
            VERSION="0.4.0-dev.${SHORT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.names.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref_type != 'tag' && github.event_name != 'release' }}

      - name: Build image (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cli
          load: true
          push: false
          tags: ${{ env.SCAN_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          vuln-type: os,library

      - name: Trivy SARIF report
        if: success() || failure()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image(s) (keyless OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PUSH_DOCKERHUB: ${{ steps.names.outputs.push_dockerhub }}
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ steps.names.outputs.ghcr }}
        run: |
          set -euo pipefail
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          if [ "${PUSH_DOCKERHUB}" = "true" ]; then
            cosign sign --yes "docker.io/${DOCKERHUB_IMAGE}@${DIGEST}"
          fi

      - name: Summary
        env:
          PUSH_DOCKERHUB: ${{ steps.names.outputs.push_dockerhub }}
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ steps.names.outputs.ghcr }}
        run: |
          {
            echo "## Published Foxhole image"
            echo ""
            echo "- GHCR: \`${GHCR_IMAGE}\`"
            if [ "${PUSH_DOCKERHUB}" = "true" ]; then
              echo "- Docker Hub: \`docker.io/${DOCKERHUB_IMAGE}\`"
            else
              echo "- Docker Hub: _skipped_ (set \`DOCKERHUB_USERNAME\` + \`DOCKERHUB_TOKEN\` repo secrets)"
            fi
            echo "- Version build-arg: \`${{ steps.ver.outputs.version }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Trivy: CRITICAL/HIGH gate passed (unfixed ignored); SARIF uploaded when available"
            echo "- Cosign: keyless sign applied"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo '```bash'
            echo "docker pull ${GHCR_IMAGE}:latest"
            if [ "${PUSH_DOCKERHUB}" = "true" ]; then
              echo "docker pull ${DOCKERHUB_IMAGE}:latest"
            fi
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp='https://github.com/jasonflaherty/foxhole/\\.github/workflows/publish-image\\.yml@.*' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\"
            echo "  ${GHCR_IMAGE}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
